<!-- 404.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>404 | پیدا نشد در امیر مارکت</title>
    <style>
        body { background: #0a192f; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; text-align: center; }
        .container { position: relative; }
        h1 { font-size: 15rem; color: #d4af37; margin: 0; opacity: 0.2; }
        .msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        .btn { display: inline-block; padding: 15px 40px; background: #d4af37; color: #0a192f; text-decoration: none; border-radius: 50px; font-weight: bold; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .btn:hover { background: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <div class="msg">
            <h2>محصول یا صفحه در قفسه موجود نیست!</h2>
            <p>هایپر مارکت امیر همیشه در کنار شماست، حتی در مسیرهای اشتباه.</p>
            <a href="/" class="btn">بازگشت به قفسه اصلی</a>
        </div>
    </div>
</body>
</html>
