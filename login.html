<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | امیر مارکت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --dark-blue: #001f3f; --gold: #D4AF37; }
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--dark-blue) 0%, #000 100%);
            font-family: 'Vazirmatn', sans-serif; overflow: hidden;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%; max-width: 400px; text-align: center; color: white;
        }
        .logo-text { color: var(--gold); font-size: 2rem; margin-bottom: 10px; font-weight: 900; }
        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px;
            border: 1px solid var(--gold); background: rgba(0,0,0,0.3); color: white; outline: none;
        }
        .btn-login {
            width: 100%; padding: 15px; background: var(--gold); color: var(--dark-blue);
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .tab { cursor: pointer; padding-bottom: 5px; opacity: 0.6; transition: 0.3s; }
        .tab.active { opacity: 1; border-bottom: 2px solid var(--gold); color: var(--gold); }
    </style>
</head>
<body>

<div class="login-card animate__animated animate__fadeInUp">
    <div class="logo-text">امیر مارکت</div>
    <p style="opacity: 0.8; margin-bottom: 30px;">ورود به لوکس‌ترین هایپر کشور</p>
    
    <div class="tabs">
        <div class="tab active" onclick="toggleForm('login')">ورود</div>
        <div class="tab" onclick="toggleForm('register')">ثبت‌نام</div>
    </div>

    <form id="authForm">
        <input type="text" placeholder="شماره موبایل یا ایمیل" required>
        <input type="password" placeholder="رمز عبور" required>
        <button type="button" class="btn-login" onclick="handleAuth()">تایید و ادامه</button>
    </form>
    
    <a href="index.html" style="color: white; font-size: 12px; text-decoration: none; display: block; margin-top: 20px; opacity: 0.5;">بازگشت به صفحه اصلی</a>
</div>

<script>
    function toggleForm(type) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }

    function handleAuth() {
        alert("خوش آمدید! این یک نسخه نمایشی است.");
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
