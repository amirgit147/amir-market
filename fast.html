<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>امیر مارکت | هایپر مارکت لوکس</title>
    <style>
        :root { --blue: #0a192f; --gold: #d4af37; --bg: #f4f7f6; --white: #fff; }
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; transition: 0.3s; }
        body { background: var(--bg); margin: 0; }
        
        /* Header */
        header { background: var(--blue); padding: 15px 5%; display: flex; justify-content: space-between; color: white; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold); text-decoration: none; }
        
        /* Main Layout */
        .container { display: flex; padding: 20px; gap: 20px; max-width: 1300px; margin: auto; }
        
        /* Filter Sidebar */
        .sidebar { flex: 1; background: var(--white); padding: 20px; border-radius: 15px; height: fit-content; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .filter-item { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Product Grid */
        .products { flex: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: var(--white); padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); position: relative; }
        .card:hover { transform: translateY(-10px); border: 1px solid var(--gold); }
        .card img { width: 100%; border-radius: 10px; height: 180px; object-fit: cover; }
        .price { color: var(--blue); font-weight: bold; font-size: 1.2rem; display: block; margin: 10px 0; }
        .btn-add { background: var(--blue); color: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; }
        
        /* 404 Section (Hidden by default) */
        #error-404 { display: none; text-align: center; padding: 100px 20px; animation: fadeIn 0.5s; }
        .big-404 { font-size: 120px; font-weight: 900; color: var(--blue); margin: 0; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) { .container { flex-direction: column; } .products { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo" onclick="showPage('shop')">امیر مارکت</a>
        <nav>
            <a href="#" style="color:white; margin-left:20px; text-decoration:none;" onclick="showPage('error')">تست 404</a>
            <span>سبد خرید (۰)</span>
        </nav>
    </header>

    <!-- Page: Shop -->
    <div id="shop-page" class="container">
        <aside class="sidebar">
            <h3>فیلتر محصولات</h3>
            <div class="filter-item">
                <p>دسته‌بندی</p>
                <label><input type="checkbox"> لبنیات لوکس</label><br>
                <label><input type="checkbox"> گوشت و پروتئین</label>
            </div>
            <div class="filter-item">
                <p>محدوده قیمت</p>
                <input type="range" style="width:100%">
            </div>
        </aside>

        <main class="products">
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="محصول">
                <h4>خاویار بلوگا اصل</h4>
                <span class="price">۴,۵۰۰,۰۰۰ تومان</span>
                <button class="btn-add">افزودن به سبد</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="محصول">
                <h4>قهوه عربیکا اختصاصی</h4>
                <span class="price">۸۵۰,۰۰۰ تومان</span>
                <button class="btn-add">افزودن به سبد</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="محصول">
                <h4>زعفران سرگل کادویی</h4>
                <span class="price">۱,۲۰۰,۰۰۰ تومان</span>
                <button class="btn-add">افزودن به سبد</button>
            </div>
        </main>
    </div>

    <!-- Page: 404 -->
    <div id="error-404">
        <h1 class="big-404">404</h1>
        <h2>صفحه پیدا نشد!</h2>
        <p>در امیر مارکت بهترین‌ها را جستجو کنید.</p>
        <button class="btn-add" style="width:auto" onclick="showPage('shop')">بازگشت به فروشگاه</button>
    </div>

    <script>
        function showPage(page) {
            document.getElementById('shop-page').style.display = page === 'shop' ? 'flex' : 'none';
            document.getElementById('error-404').style.display = page === 'error' ? 'block' : 'none';
        }
    </script>
</body>
</html>
