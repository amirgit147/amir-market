<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت | بزرگترین هایپر مارکت کشور</title>
    
    <!-- فونت و آیکون‌ها -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #001529;
            --gold: #D4AF37;
            --white: #ffffff;
            --bg: #f0f2f5;
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        
        body { margin: 0; background-color: var(--bg); color: var(--dark-blue); overflow-x: hidden; }

        /* لودینگ مشابه نسخه جدید گوگل کروم */
        #loader-wrapper {
            position: fixed; inset: 0; background: #ffffff; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .chrome-spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4285f4; /* آبی معروف گوگل */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* هدر لوکس */
        header {
            background: var(--dark-blue); color: var(--gold);
            padding: 15px 5%; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header-main { display: flex; justify-content: space-between; align-items: center; }
        .logo h1 { margin: 0; font-size: 1.6rem; font-weight: 900; }
        
        /* موتور جستجوی هوشمند */
        .search-box {
            position: relative; flex-grow: 1; max-width: 500px; margin: 0 30px;
        }
        .search-box input {
            width: 100%; padding: 12px 45px 12px 20px; border-radius: 30px;
            border: none; background: rgba(255,255,255,0.15); color: #fff;
            outline: none; font-size: 0.95rem;
        }
        .search-box input::placeholder { color: #ccc; }
        .search-box i { position: absolute; right: 15px; top: 13px; color: var(--gold); }

        .cart-btn {
            background: var(--gold); color: var(--dark-blue);
            padding: 10px 20px; border-radius: 12px; cursor: pointer;
            font-weight: bold; display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }

        /* گرید محصولات */
        .container { padding: 40px 5%; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px;
        }
        .product-card {
            background: white; border-radius: 15px; padding: 15px;
            border: 1px solid #eee; transition: 0.3s; text-align: center;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 200px; object-fit: contain; border-radius: 10px; }
        .product-card h3 { font-size: 1rem; margin: 15px 0; color: #333; height: 45px; overflow: hidden; }
        .price { font-size: 1.3rem; font-weight: 900; color: var(--dark-blue); margin-bottom: 15px; display: block; }

        .add-btn {
            background: var(--dark-blue); color: var(--gold); border: none;
            width: 100%; padding: 12px; border-radius: 10px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .add-btn:hover { background: #002a52; transform: scale(1.02); }

        /* صفحات مجازی */
        .page { display: none; }
        .page.active { display: block; }

        /* سبد خرید */
        .cart-item {
            background: white; padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }

        footer { background: var(--dark-blue); color: var(--white); padding: 40px 5%; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- لودینگ کرومی -->
    <div id="loader-wrapper">
        <div class="chrome-spinner"></div>
    </div>

    <header>
        <div class="header-main">
            <div class="logo" onclick="showPage('shop')" style="cursor:pointer">
                <h1>امیر مارکت</h1>
                <small style="color:var(--gold)">بزرگترین هایپر مارکت کشور</small>
            </div>

            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجو در بین کالاهای اساسی..." onkeyup="filterProducts()">
            </div>

            <div class="header-actions">
                <a href="#" class="cart-btn" onclick="showPage('cart')">
                    <i class="fa fa-shopping-basket"></i>
                    <span id="cart-count">۰</span> کالا
                </a>
            </div>
        </div>
    </header>

    <!-- صفحه فروشگاه -->
    <main id="shop" class="page active">
        <div class="container">
            <h2 style="margin-bottom: 30px; border-right: 4px solid var(--gold); padding-right: 15px;">کالاهای منتخب امیر مارکت</h2>
            <div class="grid" id="productGrid">
                <!-- محصولات با جاوااسکریپت تزریق می‌شوند -->
            </div>
        </div>
    </main>

    <!-- صفحه سبد خرید -->
    <div id="cart" class="page container">
        <h2><i class="fa fa-shopping-cart"></i> سبد خرید شما</h2>
        <div id="cartList"></div>
        <div id="cartTotal" style="background:var(--dark-blue); color:var(--gold); padding:25px; border-radius:15px; margin-top:20px; text-align:center;">
            <h3>جمع کل فاکتور: <span id="final-price">۰</span> تومان</h3>
            <button class="add-btn" style="max-width:300px; background:var(--gold); color:var(--dark-blue);" onclick="checkout()">تکمیل خرید و پرداخت</button>
        </div>
        <p onclick="showPage('shop')" style="text-align:center; cursor:pointer; margin-top:20px;">بازگشت به فروشگاه</p>
    </div>

    <footer>
        <p>امیر مارکت - بزرگترین هایپر مارکت کشور</p>
        <div style="font-size: 1.5rem; gap: 20px; display: flex; justify-content: center;">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-telegram"></i>
            <i class="fa fa-phone"></i>
        </div>
    </footer>

    <script>
        // دیتابیس محصولات با عکس‌های واقعی
        const allProducts = [
            { id: 1, name: "روغن مایع آفتابگردان لادن ۸۱۰ گرم", price: 198000, img: "https://dkstatics-public.digikala.com/digikala-products/111620021.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 2, name: "برنج طارم هاشمی درجه یک ۱۰ کیلوگرم", price: 1250000, img: "https://dkstatics-public.digikala.com/digikala-products/112521503.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 3, name: "پنیر سفید ۹۰۰ گرمی میهن", price: 112000, img: "https://dkstatics-public.digikala.com/digikala-products/119565532.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 4, name: "شیر پرچرب ۱ لیتری کاله", price: 32000, img: "https://dkstatics-public.digikala.com/digikala-products/3440786.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 5, name: "رب گوجه فرنگی ۸۰۰ گرمی طبیعت", price: 48000, img: "https://dkstatics-public.digikala.com/digikala-products/121085444.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 6, name: "ماکارونی ۷۰۰ گرمی زرماکارون", price: 27000, img: "https://dkstatics-public.digikala.com/digikala-products/114620.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 7, name: "چای عطری ۵۰۰ گرمی احمد", price: 285000, img: "https://dkstatics-public.digikala.com/digikala-products/b9442b083325712e5414f52e50529949f29633e9_1634044566.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" },
            { id: 8, name: "قند شکسته ۵ کیلوگرمی", price: 220000, img: "https://dkstatics-public.digikala.com/digikala-products/111326.jpg?x-oss-process=image/resize,m_lfit,h_300,w_300/quality,q_80" }
        ];

        let cart = JSON.parse(localStorage.getItem('amirCart')) || [];

        // مدیریت لودینگ کرومی
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader-wrapper');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1000); // ۱ ثانیه مکث برای نمایش لودینگ
            renderProducts(allProducts);
            updateCartIcon();
        });

        // نمایش محصولات
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <span class="price">${p.price.toLocaleString()} تومان</span>
                    <button class="add-btn" onclick="addToCart(${p.id})">افزودن به سبد</button>
                </div>
            `).join('');
        }

        // موتور جستجو
        function filterProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.includes(term));
            renderProducts(filtered);
        }

        // مدیریت سبد خرید
        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);
            if(inCart) inCart.qty++; else cart.push({...product, qty: 1});
            saveCart();
            alert(`${product.name} به سبد اضافه شد`);
        }

        function saveCart() {
            localStorage.setItem('amirCart', JSON.stringify(cart));
            updateCartIcon();
        }

        function updateCartIcon() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            if(cart.length === 0) {
                list.innerHTML = "<h4>سبد خرید شما خالی است</h4>";
                document.getElementById('cartTotal').style.display = 'none';
                return;
            }
            document.getElementById('cartTotal').style.display = 'block';
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <img src="${item.img}" width="60">
                        <div style="flex-grow:1; margin-right:15px;">
                            <strong>${item.name}</strong><br>
                            <small>${item.qty} عدد × ${item.price.toLocaleString()}</small>
                        </div>
                        <button onclick="remove(${idx})" style="border:none; background:none; color:red; cursor:pointer;"><i class="fa fa-trash"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('final-price').innerText = total.toLocaleString();
        }

        function remove(idx) {
            cart.splice(idx, 1);
            saveCart();
            renderCart();
        }

        // تغییر صفحه
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'cart') renderCart();
        }

        function checkout() {
            alert("در حال انتقال به درگاه ایمن پرداخت... با تشکر از خرید شما از امیر مارکت");
            cart = [];
            saveCart();
            showPage('shop');
        }
    </script>
</body>
</html>
