<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت | بزرگترین هایپر مارکت کشور</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #001f3f;
            --gold: #D4AF37;
            --white: #ffffff;
            --bg: #f8f9fa;
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
        }

        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--dark-blue); overflow-x: hidden; }

        /* لودینگ مدل گوگل پلی */
        #loader-wrapper {
            position: fixed; inset: 0; background: #fff; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .play-loader {
            width: 80px; height: 80px; position: relative;
            animation: rotate 2s linear infinite;
        }
        .play-loader div {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
        }
        .blue { background: var(--google-blue); top: 0; left: 0; animation: move1 2s infinite; }
        .red { background: var(--google-red); top: 0; right: 0; animation: move2 2s infinite; }
        .yellow { background: var(--google-yellow); bottom: 0; right: 0; animation: move3 2s infinite; }
        .green { background: var(--google-green); bottom: 0; left: 0; animation: move4 2s infinite; }

        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes move1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(15px, 15px); } }
        @keyframes move2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-15px, 15px); } }
        @keyframes move3 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-15px, -15px); } }
        @keyframes move4 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(15px, -15px); } }

        .loader-text { margin-top: 30px; text-align: center; }
        .loader-text h1 { color: var(--dark-blue); margin: 0; font-size: 24px; }
        .loader-text p { color: #666; margin: 5px 0; font-size: 14px; }

        header {
            background: var(--dark-blue); color: var(--gold);
            padding: 15px 5%; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); border-bottom: 3px solid var(--gold);
        }
        .header-main { display: flex; justify-content: space-between; align-items: center; }
        
        .search-box { position: relative; flex: 1; max-width: 600px; margin: 0 20px; }
        .search-box input {
            width: 100%; padding: 12px 45px 12px 20px; border-radius: 50px;
            border: 2px solid var(--gold); background: rgba(255,255,255,0.1); color: white; outline: none;
        }
        .search-box i { position: absolute; right: 18px; top: 14px; color: var(--gold); }

        .cart-btn {
            background: var(--gold); color: var(--dark-blue);
            padding: 10px 25px; border-radius: 30px; cursor: pointer;
            font-weight: 900; text-decoration: none; display: flex; align-items: center; gap: 10px;
        }

        .container { padding: 40px 5%; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px;
        }
        .card {
            background: #fff; border-radius: 20px; padding: 20px;
            border: 1px solid #eee; text-align: center; transition: 0.3s;
        }
        .card img { width: 100%; height: 220px; object-fit: contain; }
        .card h3 { font-size: 1.1rem; height: 50px; margin: 15px 0; }
        .price { font-size: 1.4rem; font-weight: 900; color: var(--dark-blue); display: block; margin-bottom: 20px; }

        .add-btn {
            background: var(--dark-blue); color: var(--gold); border: none;
            width: 100%; padding: 15px; border-radius: 12px; cursor: pointer;
            font-weight: bold; font-size: 1rem;
        }

        .page { display: none; }
        .active { display: block; }
        .cart-item {
            background: #fff; padding: 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            border-right: 5px solid var(--gold);
        }
        .delete-btn { color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 1.3rem; }

        footer { background: var(--dark-blue); color: var(--gold); padding: 50px 5%; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- لودینگ گوگل پلی -->
    <div id="loader-wrapper">
        <div class="play-loader">
            <div class="blue"></div>
            <div class="red"></div>
            <div class="yellow"></div>
            <div class="green"></div>
        </div>
        <div class="loader-text">
            <h1>امیر مارکت</h1>
            <p>در انتظار ورود به امیر مارکت...</p>
        </div>
    </div>

    <header>
        <div class="header-main">
            <div onclick="showPage('shop')" style="cursor:pointer">
                <h1 style="margin:0; font-size: 1.8rem;">امیر مارکت</h1>
                <small>بزرگترین هایپر مارکت کشور</small>
            </div>
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجو..." onkeyup="search()">
            </div>
            <a href="#" class="cart-btn" onclick="showPage('cart')">
                <i class="fa fa-shopping-cart"></i>
                <span id="cart-count">۰</span> کالا
            </a>
        </div>
    </header>

    <main id="shop" class="page active">
        <div class="container">
            <div class="product-grid" id="productGrid"></div>
        </div>
    </main>

    <div id="cart" class="page container">
        <h2>سبد خرید شما</h2>
        <div id="cartList"></div>
        <div id="cartSummary" style="background:var(--dark-blue); color:var(--gold); padding:30px; border-radius:20px; text-align:center; margin-top:30px;">
            <h3>جمع کل: <span id="final-price">۰</span> تومان</h3>
            <button class="add-btn" style="background:var(--gold); color:var(--dark-blue); max-width:400px; margin-top:20px;" onclick="connectToMellat()">اتصال به درگاه بانک ملت</button>
        </div>
    </div>

    <footer>
        <p>امیر مارکت - بزرگترین پلتفرم توزیع کالای کشور</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "روغن مایع لادن", price: 198500, img: "https://dkstatics-public.digikala.com/digikala-products/111620021.jpg" },
            { id: 2, name: "برنج طارم ۱۰ کیلو", price: 1250000, img: "https://dkstatics-public.digikala.com/digikala-products/112521503.jpg" },
            { id: 3, name: "چای احمد ۵۰۰ گرم", price: 285000, img: "https://dkstatics-public.digikala.com/digikala-products/b9442b083325712e5414f52e50529949f29633e9_1634044566.jpg" },
            { id: 4, name: "پنیر میهن ۹۰۰ گرم", price: 115000, img: "https://dkstatics-public.digikala.com/digikala-products/119565532.jpg" },
            { id: 5, name: "زعفران قائنات", price: 540000, img: "https://dkstatics-public.digikala.com/digikala-products/111326.jpg" },
            { id: 6, name: "رب طبیعت", price: 49500, img: "https://dkstatics-public.digikala.com/digikala-products/121085444.jpg" }
        ];

        let cart = JSON.parse(localStorage.getItem('amirCart')) || [];

        // اصلاح لودینگ برای بالا آمدن سریع سایت
        function hideLoader() {
            const loader = document.getElementById('loader-wrapper');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        // سایت را بعد از ۲ ثانیه حتماً نشان بده (حتی اگر عکس‌ها لود نشوند)
        setTimeout(hideLoader, 2000);

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="card">
                    <img src="${p.img}">
                    <h3>${p.name}</h3>
                    <span class="price">${p.price.toLocaleString()} تومان</span>
                    <button class="add-btn" onclick="addToCart(${p.id})">افزودن به سبد</button>
                </div>
            `).join('');
        }

        function search() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.includes(term));
            renderProducts(filtered);
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const inCart = cart.find(x => x.id === id);
            if(inCart) inCart.qty++; else cart.push({...p, qty: 1});
            save();
            alert(`${p.name} اضافه شد!`);
        }

        function save() {
            localStorage.setItem('amirCart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((acc, i) => acc + i.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            const summary = document.getElementById('cartSummary');
            if(cart.length === 0) {
                list.innerHTML = "<h3>سبد شما خالی است!</h3>";
                summary.style.display = "none";
                return;
            }
            summary.style.display = "block";
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <img src="${item.img}" width="80">
                        <div style="flex:1; margin-right: 20px;">
                            <strong>${item.name}</strong><br>
                            <span>${item.qty} عدد × ${item.price.toLocaleString()}</span>
                        </div>
                        <button class="delete-btn" onclick="remove(${idx})">❌</button>
                    </div>
                `;
            }).join('');
            document.getElementById('final-price').innerText = total.toLocaleString();
        }

        function remove(idx) {
            cart.splice(idx, 1);
            save();
            renderCart();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'cart') renderCart();
        }

        function connectToMellat() {
            alert("در حال اتصال به درگاه ملت...");
        }

        // اجرای اولیه محصولات
        renderProducts(products);
        updateCartUI();
    </script>
</body>
</html>
