<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت | هایپرمارکت لوکس</title>
    
    <!-- فراخوانی منابع فقط یک بار -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { --dark: #001f3f; --gold: #D4AF37; --soft-gold: #f1d279; --white: #fff; }
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background: #f4f4f4; color: var(--dark); overflow-x: hidden; }

        /* لودینگ هوشمند */
        #loader { 
            position: fixed; inset: 0; background: var(--dark); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--gold);
            transition: opacity 0.5s;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #003366; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* هدر */
        header { background: var(--dark); color: var(--gold); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo h1 { margin: 0; font-size: 1.5rem; cursor: pointer; }
        .cart-status { cursor: pointer; background: rgba(212,175,55,0.1); padding: 8px 15px; border-radius: 25px; border: 1px solid var(--gold); transition: 0.3s; }
        .cart-status:hover { background: var(--gold); color: var(--dark); }

        /* بخش‌ها */
        .page { display: none; padding: 20px 5%; min-height: 80vh; }
        .page.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* کارت محصول */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: var(--gold); }
        .card .icon { font-size: 50px; margin-bottom: 10px; }
        .add-btn { background: var(--dark); color: var(--gold); border: 1px solid var(--gold); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .add-btn:hover { background: var(--gold); color: var(--dark); }

        /* سبد خرید */
        .cart-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .total-box { background: var(--dark); color: var(--gold); padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; }

        /* فرم ورود */
        .login-box { max-width: 400px; margin: 50px auto; background: var(--dark); color: white; padding: 40px; border-radius: 25px; text-align: center; border: 1px solid var(--gold); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--gold); background: rgba(255,255,255,0.1); color: white; }
        .submit-btn { background: var(--gold); color: var(--dark); border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<!-- لودینگ سریع (بدون تایمر بیهوده) -->
<div id="loader">
    <div class="spinner"></div>
    <h2 style="margin-top: 20px;">امیر مارکت</h2>
</div>

<header>
    <div class="logo" onclick="showPage('shop-page')">
        <h1>امیر مارکت</h1>
        <small>لوکس‌ترین هایپر کشور</small>
    </div>
    <div class="cart-status" onclick="showPage('cart-page')">
        🛒 سبد خرید: <span id="cart-total">۰</span> تومان
    </div>
</header>

<!-- صفحه فروشگاه -->
<main id="shop-page" class="page active">
    <div class="grid" id="product-grid"></div>
</main>

<!-- صفحه سبد خرید -->
<div id="cart-page" class="page">
    <h2>سبد خرید شما</h2>
    <div id="cart-items-list"></div>
    <div id="cart-empty-msg" style="text-align:center; padding:50px; display:none;"><h3>سبد خرید خالی است! 🛒</h3></div>
    <div id="total-section" class="total-box">
        <h3>جمع کل خرید: <span id="final-price">۰</span> تومان</h3>
        <button class="submit-btn" onclick="showPage('login-page')">تکمیل فرآیند خرید</button>
    </div>
    <p style="text-align:center; margin-top:20px; cursor:pointer; color:var(--dark);" onclick="showPage('shop-page')">← بازگشت به فروشگاه</p>
</div>

<!-- صفحه ورود -->
<div id="login-page" class="page">
    <div class="login-box">
        <h2 style="color:var(--gold)">ورود / عضویت</h2>
        <input type="text" placeholder="شماره موبایل">
        <input type="password" placeholder="رمز عبور">
        <button class="submit-btn" onclick="alert('خوش آمدید!')">ورود به حساب</button>
        <p style="margin-top:20px; font-size:0.9rem; cursor:pointer" onclick="showPage('shop-page')">انصراف و بازگشت</p>
    </div>
</div>

<script>
    // محصولات
    const products = [
        { id: 1, name: "برنج طارم", price: 750000, icon: "🌾" },
        { id: 2, name: "روغن لوکس", price: 95000, icon: "🏺" },
        { id: 3, name: "پنیر تبریز", price: 120000, icon: "🧀" },
        { id: 4, name: "زعفران اصل", price: 450000, icon: "🌸" },
        { id: 5, name: "شیر تازه", price: 35000, icon: "🥛" },
        { id: 6, name: "قهوه اسپرسو", price: 280000, icon: "☕" }
    ];

    let cart = JSON.parse(localStorage.getItem('amir_cart')) || [];

    // مدیریت صفحات
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
        if(pageId === 'cart-page') renderCart();
    }

    // رندر فروشگاه
    function renderShop() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map(p => `
            <div class="card animate__animated animate__fadeInUp">
                <div class="icon">${p.icon}</div>
                <h3>${p.name}</h3>
                <div style="font-weight:bold; color:var(--dark)">${p.price.toLocaleString()} تومان</div>
                <button class="add-btn" onclick="addToCart(${p.id})">افزودن به سبد</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const itemInCart = cart.find(item => item.id === id);
        if(itemInCart) itemInCart.qty++; else cart.push({...product, qty: 1});
        saveCart();
        alert(`${product.name} به سبد اضافه شد`);
    }

    function saveCart() {
        localStorage.setItem('amir_cart', JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        let total = 0;
        cart.forEach(i => total += (i.price * i.qty));
        document.getElementById('cart-total').innerText = total.toLocaleString();
    }

    function renderCart() {
        const list = document.getElementById('cart-items-list');
        const totalSection = document.getElementById('total-section');
        const emptyMsg = document.getElementById('cart-empty-msg');
        
        if(cart.length === 0) {
            list.innerHTML = '';
            totalSection.style.display = 'none';
            emptyMsg.style.display = 'block';
            return;
        }

        emptyMsg.style.display = 'none';
        totalSection.style.display = 'block';
        let total = 0;
        
        list.innerHTML = cart.map((item, index) => {
            total += (item.price * item.qty);
            return `
                <div class="cart-item animate__animated animate__fadeIn">
                    <div>
                        <strong>${item.icon} ${item.name}</strong><br>
                        <small>${item.price.toLocaleString()} تومان</small>
                    </div>
                    <div>
                        <span>تعداد: ${item.qty}</span>
                        <button onclick="removeFromCart(${index})" style="background:red; color:white; border:none; border-radius:5px; margin-right:10px; cursor:pointer">حذف</button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('final-price').innerText = total.toLocaleString();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        saveCart();
        renderCart();
    }

    // شروع کار سایت
    window.addEventListener('load', () => {
        renderShop();
        updateCartUI();
        // حذف لودینگ بلافاصله بعد از آماده شدن
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
    });
</script>

</body>
</html>
