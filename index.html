<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت | اسنپ استایل</title>
    <style>
        /* استایل فوق سریع سیستمی */
        :root { --blue: #008eb2; --bg: #f2f2f2; }
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { margin: 0; background: var(--bg); padding-bottom: 70px; visibility: hidden; } /* مخفی تا لحظه لود */

        /* لودینگ حبابی - کاملا آفلاین و سریع */
        #loading-screen { 
            position: fixed; inset: 0; background: #0b141a; z-index: 10000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: visible;
        }
        .blob {
            width: 90px; height: 90px; background: #7dbbff; 
            border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            animation: move 2s infinite alternate;
            box-shadow: 0 0 30px rgba(125,187,255,0.3);
        }
        @keyframes move { to { border-radius: 60% 40% 40% 60% / 60% 60% 40% 40%; transform: scale(1.1); } }

        /* هدر اسنپ مارکتی */
        header { background: #fff; padding: 10px 15px; position: sticky; top: 0; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search { width: 100%; padding: 12px; border: none; background: #f0f0f1; border-radius: 10px; margin-top: 10px; outline: none; }

        /* محصولات */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #fff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; position: relative; }
        .card img { width: 100%; height: 130px; object-fit: contain; }
        .card h3 { font-size: 12px; margin: 8px 0; height: 35px; overflow: hidden; color: #444; }
        .price { font-weight: bold; font-size: 14px; }
        .add-btn { position: absolute; bottom: 10px; left: 10px; border: 1px solid var(--blue); background: #fff; color: var(--blue); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* صفحات */
        .page { display: none; padding: 15px; }
        .active { display: block; }
        
        /* منو پایین */
        .nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #ddd; }
        .nav-item { text-align: center; font-size: 11px; color: #777; cursor: pointer; }
    </style>
</head>
<body>

<!-- لودینگ ارسالی شما -->
<div id="loading-screen">
    <div class="blob"></div>
    <div style="color:white; margin-top:20px; text-align:center;">
        <b>امیر مارکت</b><br><small>در انتظار ورود...</small>
    </div>
</div>

<header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <b style="color:var(--blue); font-size:20px;">AMIR MARKET</b>
        <div onclick="v('ca')" style="cursor:pointer">🛒 <span id="count">۰</span></div>
    </div>
    <input type="text" class="search" placeholder="جستجوی سریع..." onkeyup="sr(this.value)">
</header>

<div id="sh" class="page active"><div class="grid" id="g"></div></div>

<div id="ca" class="page">
    <h3>سبد خرید</h3>
    <div id="list"></div>
    <hr>
    <div id="total-box" style="padding:10px; background:#fff; border-radius:10px; text-align:center;">
        جمع کل: <b id="tp">۰</b> تومان
        <button onclick="pay()" style="width:100%; background:var(--blue); color:#fff; border:none; padding:15px; border-radius:10px; margin-top:10px; font-weight:bold;">پرداخت آنلاین (ملت)</button>
    </div>
</div>

<div class="nav">
    <div class="nav-item" onclick="v('sh')">🏠<br>ویترین</div>
    <div class="nav-item" onclick="v('ca')">🛍️<br>سبد خرید</div>
</div>

<script>
    // اطلاعات دقیق محصولات با تصاویر منطبق
    const products = [
        { id: 1, n: "روغن مایع لادن ۸۱۰ گرم", p: 198000, img: "https://dkstatics-public.digikala.com/digikala-products/111620021.jpg" },
        { id: 2, n: "برنج طارم ۱۰ کیلوگرم", p: 1250000, img: "https://dkstatics-public.digikala.com/digikala-products/112521503.jpg" },
        { id: 3, n: "چای احمد ۵۰۰ گرمی", p: 285000, img: "https://dkstatics-public.digikala.com/digikala-products/b9442b083325712e5414f52e50529949f29633e9_1634044566.jpg" },
        { id: 4, n: "پنیر میهن ۹۰۰ گرمی", p: 115000, img: "https://dkstatics-public.digikala.com/digikala-products/119565532.jpg" },
        { id: 5, n: "رب گوجه طبیعت ۸۰۰ گرم", p: 49500, img: "https://dkstatics-public.digikala.com/digikala-products/121085444.jpg" },
        { id: 6, n: "ماکارونی ۷۰۰ گرمی زر", p: 27000, img: "https://dkstatics-public.digikala.com/digikala-products/114620.jpg" }
    ];

    let cart = [];

    // کد طلایی برای بالا آمدن سریع سایت
    document.addEventListener("DOMContentLoaded", () => {
        render(products);
        // سایت را حتما در کمتر از ۱ ثانیه نمایش بده
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            document.body.style.visibility = 'visible';
        }, 800); 
    });

    function render(arr) {
        document.getElementById('g').innerHTML = arr.map(x => `
            <div class="card">
                <img src="${x.img}" alt="${x.n}">
                <h3>${x.n}</h3>
                <div class="price">${x.p.toLocaleString()}</div>
                <button class="add-btn" onclick="add(${x.id})">+</button>
            </div>
        `).join('');
    }

    function add(id) {
        const item = products.find(p => p.id === id);
        cart.push(item);
        document.getElementById('count').innerText = cart.length;
        alert(item.n + " به سبد اضافه شد");
    }

    function sr(val) {
        const filtered = products.filter(p => p.n.includes(val));
        render(filtered);
    }

    function v(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'ca') drawCart();
    }

    function drawCart() {
        const list = document.getElementById('list');
        if(!cart.length) { list.innerHTML = "سبد خرید شما خالی است"; return; }
        let total = 0;
        list.innerHTML = cart.map((x, i) => {
            total += x.p;
            return `<div style="background:#fff; padding:10px; margin-bottom:5px; display:flex; justify-content:space-between; border-radius:8px;">
                <span>${x.n}</span>
                <b>${x.p.toLocaleString()} <span onclick="del(${i})" style="color:red; cursor:pointer">🗑️</span></b>
            </div>`;
        }).join('');
        document.getElementById('tp').innerText = total.toLocaleString();
    }

    function del(i) {
        cart.splice(i, 1);
        document.getElementById('count').innerText = cart.length;
        drawCart();
    }

    function pay() {
        alert("در حال اتصال مستقیم به درگاه بانک ملت...");
    }
</script>

</body>
</html>
