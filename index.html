<!-- مستقل‌ترین نسخه: فقط کافیست این کد را در یک فایل .html ذخیره کنید -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>امیر مارکت | نسخه ایستا و سریع</title>
    <style>
        :root { --p: #0a192f; --g: #d4af37; --bg: #f8f9fa; --t: #111; --card: #fff; }
        [data-theme="dark"] { --p: #010409; --g: #f1d592; --bg: #0d1117; --t: #f0f6fc; --card: #161b22; }
        body { background: var(--bg); color: var(--t); font-family: Tahoma; margin: 0; transition: 0.4s; }
        
        /* لودینگ خفن */
        #loader { position: fixed; inset: 0; background: var(--p); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spin { width: 50px; height: 50px; border: 4px solid var(--g); border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }

        /* هدر و بلور جستجو */
        header { background: var(--p); padding: 1rem 5%; display: flex; gap: 2rem; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .search-box { flex: 1; position: relative; z-index: 1100; }
        .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: none; outline: none; }
        .blur-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; z-index: 1050; }
        
        /* محصولات و فیلتر */
        .layout { display: flex; padding: 2rem; gap: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; flex: 1; }
        .card { background: var(--card); padding: 1rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; border-radius: 10px; }
        
        /* هزینه بسته‌بندی */
        .fee { background: var(--g); color: var(--p); padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>
    <div id="loader"><div class="spin"></div></div>
    <div class="blur-overlay" id="blur"></div>

    <header>
        <div style="color:var(--g); font-size:1.5rem; font-weight:bold;">امیر مارکت</div>
        <div class="search-box">
            <input type="text" id="src" placeholder="جستجو در ۵۰ محصول لوکس...">
            <div id="sugg" style="display:none; position:absolute; background:white; width:100%; color:black; border-radius:8px; margin-top:5px; padding:10px;">پیشنهاد: خاویار، زعفران، قهوه...</div>
        </div>
        <button onclick="document.body.toggleAttribute('data-theme')">🌙/☀️</button>
        <a href="/login" style="color:white; text-decoration:none;">👤 ورود</a>
        <a href="/cart" style="color:white; text-decoration:none;">🛒 سبد</a>
    </header>

    <div class="layout">
        <aside style="width:250px;">
            <h3>فیلترها</h3>
            <label><input type="checkbox"> برند امیر</label><br>
            <label><input type="checkbox"> موجود</label>
            <div class="fee">هزینه بسته‌بندی: ۱۰,۰۰۰ تومان</div>
        </aside>
        <main class="grid" id="container"></main>
    </div>

    <script>
        // تولید ۵۰ محصول
        const c = document.getElementById('container');
        for(let i=1; i<=50; i++) {
            c.innerHTML += `<div class="card"><img src="https://picsum.photos/200?sig=${i}"><h4>کالای لوکس شماره ${i}</h4><p style="color:var(--g)">۵۰۰,۰۰۰ تومان</p><button style="width:100%; border:none; background:var(--p); color:white; padding:10px; border-radius:8px; cursor:pointer;">خرید</button></div>`;
        }
        // لودینگ و جستجو
        window.onload = () => document.getElementById('loader').remove();
        const src = document.getElementById('src');
        const blur = document.getElementById('blur');
        src.onfocus = () => { blur.style.display = 'block'; document.getElementById('sugg').style.display='block'; };
        blur.onclick = () => { blur.style.display = 'none'; document.getElementById('sugg').style.display='none'; };
    </script>
</body>
</html>
