<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت | بزرگترین هایپر مارکت کشور</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ef394e; /* رنگ برند اکالا */
            --bg: #f8f8f8;
            --card-bg: #ffffff;
            --text: #333;
            --header-bg: #ffffff;
            --border: #eeeeee;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --header-bg: #1a1a1a;
            --border: #333;
        }

        * { box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Vazirmatn', sans-serif; margin: 0; background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

        /* لودینگ خفن */
        #loader {
            position: fixed; inset: 0; background: #fff; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader-logo { width: 100px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* هدر */
        header { 
            background: var(--header-bg); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 10px 5%;
        }
        .top-nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .logo-box h1 { color: var(--primary); margin: 0; font-size: 1.5rem; }
        
        .search-bar { 
            flex-grow: 1; position: relative; max-width: 600px;
        }
        .search-bar input { 
            width: 100%; padding: 12px 45px 12px 15px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
        }
        .search-bar i { position: absolute; right: 15px; top: 15px; color: #888; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn { cursor: pointer; font-size: 1.3rem; position: relative; }
        .badge { position: absolute; top: -8px; left: -8px; background: var(--primary); color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; }

        /* بنر و دسته‌بندی */
        .hero { padding: 20px 5%; }
        .category-scroll { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .cat-item { min-width: 80px; text-align: center; cursor: pointer; }
        .cat-item img { width: 60px; height: 60px; border-radius: 50%; background: #fff; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* لیست محصولات */
        .container { padding: 0 5%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { 
            background: var(--card-bg); border-radius: 15px; padding: 15px; 
            border: 1px solid var(--border); position: relative; overflow: hidden;
        }
        .product-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .price { font-weight: 900; color: var(--text); font-size: 1.1rem; }
        .add-btn { 
            background: white; color: var(--primary); border: 1px solid var(--primary);
            width: 35px; height: 35px; border-radius: 10px; cursor: pointer; font-size: 1.2rem;
        }
        .add-btn:hover { background: var(--primary); color: white; }

        /* فوتر موبایل */
        .mobile-footer {
            position: fixed; bottom: 0; width: 100%; background: var(--header-bg);
            display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .foot-item { text-align: center; color: #888; font-size: 0.8rem; cursor: pointer; }
        .foot-item.active { color: var(--primary); }

        /* صفحات مجازی */
        .page { display: none; padding: 20px 5%; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* استایل درگاه پرداخت شبیه‌سازی شده */
        .bank-page { background: #e1e1e1; min-height: 100vh; padding: 20px; }
        .bank-card { max-width: 500px; margin: 0 auto; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        .bank-header { background: #2b4a83; color: white; padding: 15px; text-align: center; }

    </style>
</head>
<body data-theme="light">

<!-- لودینگ خفن -->
<div id="loader">
    <div class="loader-logo">
        <h1 style="color:var(--primary)">AMIR MARKET</h1>
    </div>
    <div style="width: 200px; height: 4px; background: #eee; margin-top: 20px; border-radius: 10px; overflow: hidden;">
        <div id="progress" style="width: 0%; height: 100%; background: var(--primary); transition: 0.5s;"></div>
    </div>
    <p>بزرگترین هایپر مارکت کشور...</p>
</div>

<!-- هدر -->
<header>
    <div class="top-nav">
        <div class="logo-box">
            <h1 onclick="showPage('home')">امیر مارکت</h1>
        </div>
        
        <div class="search-bar">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="جستجو در بین هزاران کالا..." onkeyup="searchProducts()">
        </div>

        <div class="nav-actions">
            <div class="icon-btn" onclick="toggleTheme()"><i class="fa fa-moon"></i></div>
            <div class="icon-btn" onclick="showPage('cart')">
                <i class="fa fa-shopping-cart"></i>
                <span class="badge" id="cartBadge">۰</span>
            </div>
            <div class="icon-btn" onclick="showPage('login')"><i class="fa fa-user"></i></div>
        </div>
    </div>
</header>

<!-- محتوای اصلی -->
<main id="home" class="page active">
    <div class="hero">
        <div class="category-scroll">
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081840.png" alt=""><div>لبنیات</div></div>
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/706/706164.png" alt=""><div>پروتئینی</div></div>
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/1625/1625099.png" alt=""><div>نوشیدنی</div></div>
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/2674/2674486.png" alt=""><div>شوینده</div></div>
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/2329/2329895.png" alt=""><div>میوه</div></div>
            <div class="cat-item"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050158.png" alt=""><div>خواروبار</div></div>
        </div>
    </div>

    <div class="container">
        <h2 id="sectionTitle">پرفروش‌ترین‌های امروز</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>
</main>

<!-- سبد خرید -->
<div id="cart" class="page">
    <h2>سبد خرید شما</h2>
    <div id="cartList"></div>
    <div id="cartTotal" style="background:var(--card-bg); padding:20px; border-radius:15px; margin-top:20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span>مبلغ قابل پرداخت:</span>
            <span id="totalPrice" style="font-weight:900; font-size:1.5rem; color:var(--primary)">۰ تومان</span>
        </div>
        <button class="submit-btn" style="background:var(--primary); color:white; width:100%; padding:15px; border:none; border-radius:10px; cursor:pointer;" onclick="goToBank()">تایید و پرداخت نهایی</button>
    </div>
</div>

<!-- ورود -->
<div id="login" class="page">
    <div style="max-width:400px; margin: 50px auto; background:var(--card-bg); padding:30px; border-radius:20px; text-align:center;">
        <h2>ورود به حساب</h2>
        <input type="text" placeholder="شماره موبایل" style="width:100%; padding:12px; margin:10px 0;">
        <button class="submit-btn" style="background:var(--primary); color:white; width:100%; padding:12px; border:none; border-radius:10px;" onclick="doLogin()">ورود</button>
    </div>
</div>

<!-- درگاه پرداخت شبیه‌سازی شده -->
<div id="bank" class="page bank-page">
    <div class="bank-card">
        <div class="bank-header">
            <h3>درگاه پرداخت بانکی (شبیه‌ساز)</h3>
            <p>امیر مارکت | پذیرنده معتبر</p>
        </div>
        <div style="padding:20px;">
            <p>مبلغ: <strong id="bankAmount"></strong> تومان</p>
            <input type="text" placeholder="شماره کارت" style="letter-spacing:5px; text-align:center;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" placeholder="CVV2">
                <input type="text" placeholder="تاریخ انقضا">
            </div>
            <input type="password" placeholder="رمز دوم (اینترنتی)">
            <button style="background:#27ae60; color:white; width:100%; padding:15px; border:none; margin-top:20px;" onclick="finishPayment()">پرداخت موفق</button>
            <button style="background:#eee; width:100%; padding:10px; border:none; margin-top:10px;" onclick="showPage('cart')">انصراف</button>
        </div>
    </div>
</div>

<!-- فوتر موبایل -->
<div class="mobile-footer">
    <div class="foot-item active" onclick="showPage('home')"><i class="fa fa-home"></i><div>خانه</div></div>
    <div class="foot-item" onclick="showPage('cart')"><i class="fa fa-shopping-basket"></i><div>سبد خرید</div></div>
    <div class="foot-item" onclick="showPage('login')"><i class="fa fa-user"></i><div>پروفایل</div></div>
</div>

<script>
    // محصولات با قیمت واقعی روز ایران
    const products = [
        { id: 1, name: "روغن آفتابگردان ۸۱۰ گرمی لادن", price: 198500, img: "https://dkstatics-public.digikala.com/digikala-products/111620021.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
        { id: 2, name: "برنج طارم هاشمی ۱۰ کیلوگرمی", price: 1250000, img: "https://dkstatics-public.digikala.com/digikala-products/112521503.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
        { id: 3, name: "پنیر سفید نسبی ۹۰۰ گرمی میهن", price: 115000, img: "https://dkstatics-public.digikala.com/digikala-products/119565532.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
        { id: 4, name: "شیر پرچرب ۱ لیتری کاله", price: 32000, img: "https://dkstatics-public.digikala.com/digikala-products/3440786.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
        { id: 5, name: "رب گوجه فرنگی ۸۰۰ گرمی طبیعت", price: 45000, img: "https://dkstatics-public.digikala.com/digikala-products/121085444.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
        { id: 6, name: "ماکارونی ۷۰۰ گرمی زرماکارون", price: 27000, img: "https://dkstatics-public.digikala.com/digikala-products/114620.jpg?x-oss-process=image/resize,m_lfit,h_800,w_800/quality,q_90" },
    ];

    let cart = JSON.parse(localStorage.getItem('amir_market_cart')) || [];

    // مدیریت لودینگ
    window.addEventListener('load', () => {
        let prog = document.getElementById('progress');
        let width = 0;
        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                document.getElementById('loader').style.display = 'none';
                renderProducts(products);
                updateCartBadge();
            } else {
                width += 10;
                prog.style.width = width + '%';
            }
        }, 50);
    });

    // رندر محصولات
    function renderProducts(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = items.map(p => `
            <div class="product-card">
                <img src="${p.img}" class="product-img" alt="${p.name}">
                <div style="height:45px; overflow:hidden; font-size:0.9rem;">${p.name}</div>
                <div class="price-row">
                    <div class="price">${p.price.toLocaleString()} تومان</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">+</button>
                </div>
            </div>
        `).join('');
    }

    // جستجو
    function searchProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.includes(query));
        renderProducts(filtered);
        document.getElementById('sectionTitle').innerText = query ? `نتایج برای: ${query}` : "پرفروش‌ترین‌های امروز";
    }

    // سبد خرید
    function addToCart(id) {
        const p = products.find(x => x.id === id);
        const exist = cart.find(x => x.id === id);
        if(exist) exist.qty++; else cart.push({...p, qty:1});
        saveCart();
    }

    function saveCart() {
        localStorage.setItem('amir_market_cart', JSON.stringify(cart));
        updateCartBadge();
    }

    function updateCartBadge() {
        document.getElementById('cartBadge').innerText = cart.length;
    }

    function renderCart() {
        const list = document.getElementById('cartList');
        if(cart.length === 0) {
            list.innerHTML = "<h3>سبد خرید شما خالی است</h3>";
            document.getElementById('cartTotal').style.display = 'none';
            return;
        }
        document.getElementById('cartTotal').style.display = 'block';
        let total = 0;
        list.innerHTML = cart.map((item, idx) => {
            total += item.price * item.qty;
            return `
                <div style="display:flex; justify-content:space-between; background:var(--card-bg); pading:15px; margin-bottom:10px; border-radius:10px; align-items:center; padding:10px;">
                    <img src="${item.img}" width="50">
                    <div>${item.name} (${item.qty} عدد)</div>
                    <div>${(item.price * item.qty).toLocaleString()} تومان</div>
                    <button onclick="removeItem(${idx})" style="color:red; border:none; background:none;">❌</button>
                </div>
            `;
        }).join('');
        document.getElementById('totalPrice').innerText = total.toLocaleString() + " تومان";
        document.getElementById('bankAmount').innerText = total.toLocaleString();
    }

    function removeItem(idx) {
        cart.splice(idx, 1);
        saveCart();
        renderCart();
    }

    // تم دارک
    function toggleTheme() {
        const body = document.body;
        const icon = document.querySelector('.icon-btn i');
        if(body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            icon.className = 'fa fa-sun';
        } else {
            body.setAttribute('data-theme', 'light');
            icon.className = 'fa fa-moon';
        }
    }

    // تغییر صفحات
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'cart') renderCart();
    }

    function doLogin() {
        alert("خوش آمدید! ورود با موفقیت انجام شد.");
        showPage('home');
    }

    function goToBank() {
        if(cart.length === 0) return alert("سبد شما خالی است!");
        showPage('bank');
    }

    function finishPayment() {
        alert("پرداخت با موفقیت انجام شد. سفارش شما در صف ارسال امیر مارکت (بزرگترین هایپر کشور) قرار گرفت.");
        cart = [];
        saveCart();
        showPage('home');
    }
</script>

</body>
</html>
