<!-- index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>404 | امیر مارکت</title>
    <style>
        :root { --blue: #0a192f; --gold: #d4af37; --white: #ffffff; }
        body { margin: 0; font-family: Tahoma, sans-serif; background: var(--white); color: var(--blue); overflow-x: hidden; }
        .header { background: var(--blue); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { color: var(--gold); font-size: 24px; font-weight: bold; text-decoration: none; }
        .main-404 { height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; animation: fadeIn 1s ease; }
        .big-text { font-size: 150px; font-weight: 900; background: linear-gradient(to bottom, var(--blue), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn { padding: 12px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-gold { background: var(--gold); color: var(--blue); }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212,175,55,0.4); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">امیر مارکت</a>
        <nav style="display:flex; gap:20px;">
            <a href="/" style="color:white; text-decoration:none;">صفحه اصلی</a>
            <a href="/shop" style="color:white; text-decoration:none;">محصولات</a>
        </nav>
    </header>

    <main class="main-404">
        <h1 class="big-text">404</h1>
        <h2>صفحه مورد نظر پیدا نشد</h2>
        <p>بهترین هایپر مارکت در کشور، همیشه در کنار شماست.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-gold">بازگشت به خانه</a>
            <a href="javascript:history.back()" class="btn" style="border: 1px solid var(--blue);">صفحه قبلی</a>
        </div>
    </main>
</body>
</html>
