<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امیر مارکت</title>
    <style>
        /* استایل پایه فوق سریع */
        :root { --p: #008eb2; --bg: #f5f5f5; }
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { margin: 0; background: var(--bg); overflow-x: hidden; padding-bottom: 60px; }

        /* لودینگ حبابی - اجرای آنی با CSS */
        #l { position: fixed; inset: 0; background: #0b141a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; }
        .b { width: 80px; height: 80px; background: #7dbbff; border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; animation: a 1.5s infinite alternate; }
        @keyframes a { to { border-radius: 60% 40% 40% 60% / 60% 60% 40% 40%; transform: scale(1.1); } }
        .t { color: white; margin-top: 20px; text-align: center; }

        /* هدر فشرده */
        h { background: #fff; padding: 10px; position: sticky; top: 0; z-index: 100; display: block; box-shadow: 0 2px 5px #0001; }
        .s { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #f0f0f1; outline: none; margin-top: 5px; }

        /* محصولات */
        .c { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .i { background: #fff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; border: 1px solid #eee; }
        .i img { width: 100%; height: 120px; object-fit: contain; }
        .i h3 { font-size: 13px; height: 35px; margin: 5px 0; overflow: hidden; }
        .pr { font-weight: bold; color: #000; font-size: 14px; }
        .btn { background: #fff; color: var(--p); border: 1px solid var(--p); border-radius: 6px; padding: 5px 10px; cursor: pointer; float: left; }

        /* صفحات */
        .p { display: none; padding: 10px; }
        .active { display: block; }
        
        /* منو پایین */
        .m { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 8px; border-top: 1px solid #eee; }
        .mi { text-align: center; font-size: 11px; color: #777; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

<div id="l"><div class="b"></div><div class="t"><b>امیر مارکت</b><br><small>در انتظار ورود...</small></div></div>

<h>
    <div style="display:flex; justify-content:space-between; color:var(--p); font-weight:bold">
        <span onclick="v('sh')">AMIR MARKET</span>
        <span onclick="v('ca')">🛒 <span id="cc">۰</span></span>
    </div>
    <input type="text" class="s" placeholder="جستجوی سریع..." onkeyup="sr(this.value)">
</h>

<div id="sh" class="p active"><div class="c" id="g"></div></div>

<div id="ca" class="p">
    <h3>سبد خرید</h3>
    <div id="cl"></div>
    <div id="sum" style="margin-top:20px; padding:15px; background:#fff; border-radius:10px">
        جمع کل: <b id="tp">۰</b> تومان
        <button onclick="alert('اتصال به بانک ملت...')" style="width:100%; background:var(--p); color:#fff; border:none; padding:12px; border-radius:8px; margin-top:10px">پرداخت نهایی</button>
    </div>
</div>

<div class="m">
    <div class="mi" onclick="v('sh')">🏠<br>ویترین</div>
    <div class="mi" onclick="v('ca')">🛍️<br>سبد خرید</div>
</div>

<script>
    const data = [
        { id: 1, n: "روغن لادن ۸۱۰ گرم", p: 198000, g: "https://dkstatics-public.digikala.com/digikala-products/111620021.jpg" },
        { id: 2, n: "برنج طارم ۱۰ کیلو", p: 1250000, g: "https://dkstatics-public.digikala.com/digikala-products/112521503.jpg" },
        { id: 3, n: "چای احمد ۵۰۰ گرم", p: 285000, g: "https://dkstatics-public.digikala.com/digikala-products/b9442b083325712e5414f52e50529949f29633e9_1634044566.jpg" },
        { id: 4, n: "پنیر میهن ۹۰۰ گرم", p: 115000, g: "https://dkstatics-public.digikala.com/digikala-products/119565532.jpg" },
        { id: 5, n: "رب طبیعت ۸۰۰ گرم", p: 49500, g: "https://dkstatics-public.digikala.com/digikala-products/121085444.jpg" },
        { id: 6, n: "ماکارونی ۷۰۰ گرم زر", p: 27000, g: "https://dkstatics-public.digikala.com/digikala-products/114620.jpg" }
    ];

    let cart = [];

    // لودینگ آنی (زیر ۰.۵ ثانیه)
    window.onload = () => {
        document.getElementById('l').style.opacity = '0';
        setTimeout(() => document.getElementById('l').style.display = 'none', 200);
        render(data);
    };

    function render(items) {
        document.getElementById('g').innerHTML = items.map(x => `
            <div class="i">
                <img src="${x.g}" loading="lazy">
                <h3>${x.n}</h3>
                <div>
                    <span class="pr">${x.p.toLocaleString()}</span>
                    <button class="btn" onclick="add(${x.id})">+</button>
                </div>
            </div>
        `).join('');
    }

    function sr(v) {
        render(data.filter(x => x.n.includes(v)));
    }

    function add(id) {
        const item = data.find(x => x.id === id);
        cart.push(item);
        document.getElementById('cc').innerText = cart.length;
        alert('اضافه شد');
    }

    function v(id) {
        document.querySelectorAll('.p').forEach(x => x.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'ca') rc();
    }

    function rc() {
        const l = document.getElementById('cl');
        if(!cart.length) { l.innerHTML = "خالی است"; return; }
        let t = 0;
        l.innerHTML = cart.map((x, i) => {
            t += x.p;
            return `<div style="background:#fff; padding:10px; margin-bottom:5px; display:flex; justify-content:space-between">
                <span>${x.n}</span>
                <b>${x.p.toLocaleString()} <span onclick="del(${i})" style="color:red; cursor:pointer">🗑️</span></b>
            </div>`;
        }).join('');
        document.getElementById('tp').innerText = t.toLocaleString();
    }

    function del(i) {
        cart.splice(i, 1);
        document.getElementById('cc').innerText = cart.length;
        rc();
    }

    function showPage(id) { v(id); }
</script>

</body>
</html>
